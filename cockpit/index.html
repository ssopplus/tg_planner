<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-cockpit</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #fafbfc; --line: #e2e5ea; --text: #1b1f24; --muted: #69717d;
  --accent: #3b6fd8; --accent-soft: #e8effc;
  --wait: #d97a1e; --wait-soft: #fdf1e4; --busy: #2b9a58; --busy-soft: #e5f5ec;
  --review: #3b6fd8; --review-soft: #e8effc; --idle: #9aa3ae; --idle-soft: #f0f1f3;
  --add-bg: #e6f6ea; --add: #1a7f37; --del-bg: #fdecec; --del: #c0362c; --hunk: #eef2fb;
  --chip: #eef0f3; --code-bg: #f3f4f6; --user-bg: #f0f4fd;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b20; --panel2: #1b2026; --line: #2a3038; --text: #e3e7ec; --muted: #8b95a1;
    --accent: #6d9bff; --accent-soft: #1c2738;
    --wait: #f0a050; --wait-soft: #2e2216; --busy: #4cc27e; --busy-soft: #142a1d;
    --review: #6d9bff; --review-soft: #1a2436; --idle: #6b7380; --idle-soft: #1d2127;
    --add-bg: #12301d; --add: #6fdc8c; --del-bg: #3a1716; --del: #ff8a80; --hunk: #1c2433;
    --chip: #232a33; --code-bg: #20262e; --user-bg: #19212e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); border-color: var(--line); }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 26px 3px 8px; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
select:hover { border-color: var(--accent); }
input[type=text]:focus, input[type=search]:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* ---------- верхняя панель ---------- */
header { display: flex; gap: 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
header h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
nav { display: flex; gap: 2px; }
nav a { padding: 4px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
nav a .badge { margin-left: 4px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--wait); color: #fff; font-size: 11px; text-align: center; font-weight: 600; }
.spacer { flex: 1; }
header input[type=search] { width: 240px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; background: var(--panel); color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.stale { color: var(--del); font-size: 12px; }
#app { flex: 1; min-height: 0; overflow: auto; }

/* ---------- общие элементы ---------- */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.waiting { background: var(--wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wait) 25%, transparent); }
.dot.busy { background: var(--busy); animation: pulse 1.4s infinite; }
.dot.review { background: var(--review); }
.dot.idle { background: var(--idle); }
.dot.done { background: var(--add); }
@keyframes pulse { 50% { opacity: .35; } }
.chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.chip.key { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.acts button { padding: 1px 8px; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.acts .nextbtn { color: var(--accent); border-color: var(--accent-soft); }
.rules .rrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 6px; }
.rules .rrow .lbl { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
.rules .rrow .ex { grid-column: 1 / -1; font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
.rules .rrow .btns { display: flex; gap: 6px; align-items: start; }
/* Режим сессии: Manual — серый, остальные заметнее, чтобы сразу было видно, кто правит без спроса. */
.chip.mode-acceptEdits { color: var(--busy); background: var(--busy-soft); }
.chip.mode-plan { color: var(--accent); background: var(--accent-soft); }
.chip.mode-auto, .chip.mode-bypassPermissions, .chip.mode-dontAsk { color: var(--wait); background: var(--wait-soft); }
.time { color: var(--muted); font-size: 12px; white-space: nowrap; }
.muted { color: var(--muted); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; }
@keyframes rot { to { transform: rotate(360deg); } }
.empty { color: var(--muted); padding: 48px; text-align: center; }

/* ---------- доска ---------- */
.board { padding: 14px 16px 40px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)) repeat(2, minmax(180px, .75fr)); gap: 10px; }
.cols.nocold { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
.colhead { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; color: var(--muted); padding: 2px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
.colhead .n { font-weight: 500; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col.cold .card { padding: 6px 10px; }
.col.cold .card .prompt, .col.cold .card .foot { display: none; }
.lane { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; margin-bottom: 12px; }
.lanehead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; user-select: none; }
.lanehead h2 { font-size: 14px; margin: 0; }
.lanehead .caret { color: var(--muted); width: 10px; }
.lane.collapsed .cols { display: none; }
.lane.collapsed .lanehead { margin-bottom: 0; }
.placeholder { border: 1px dashed var(--line); border-radius: 8px; height: 34px; }
.cols.quietrow { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.quietrow .card { padding: 6px 10px; }
.quietrow .card .prompt, .quietrow .card .foot { display: none; }
.lane.quiet { background: transparent; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.card:hover { border-color: var(--accent); }
.card.waiting { border-left: 3px solid var(--wait); }
.card.busy { border-left: 3px solid var(--busy); }
.card.review { border-left: 3px solid var(--review); }
.card.done { border-left: 3px solid var(--add); }
.card .row { display: flex; gap: 6px; align-items: center; }
.card .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.card .title.derived { color: var(--muted); font-style: italic; font-weight: 500; }
.card .why { font-size: 12px; margin-top: 2px; }
.card .why.waiting { color: var(--wait); }
.card .prompt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-size: 12.5px; }
.card .foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ---------- входящие ---------- */
.inbox { max-width: 1560px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.inbox h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
/* Правая колонка — всё, что ждёт моего действия; держится на экране, пока листаешь левую. */
.inbox .icol.act { position: sticky; top: 0; max-height: calc(100vh - 70px); overflow-y: auto; }
.inbox .icol.act.has { border-left: 3px solid var(--wait); padding-left: 14px; }
.irow { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.irow:hover { border-color: var(--accent); }
.irow .dot { margin-top: 6px; }
.irow .t { font-weight: 600; }
.irow .ex { color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.irow .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.plan { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.plan .pbar { flex: none; width: 120px; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.plan .pbar i { display: block; height: 100%; background: var(--busy); border-radius: 3px; }
.irow > div { min-width: 0; }
.plan .tkey { flex: none; white-space: nowrap; }
.plan .pnext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.plan .pdone { color: var(--busy); }

/* ---------- страница сессии ---------- */
.sess { display: grid; grid-template-columns: 1fr 400px; height: 100%; min-height: 0; }
.sess-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sess-head { padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.sess-head .crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.sess-head .crumbs a { color: var(--muted); }
.sess-head .titlerow { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.sess-head h2 { font-size: 18px; margin: 0; cursor: text; }
.sess-head h2:hover { text-decoration: underline dotted var(--muted); }
.sess-head input.rename { font-size: 17px; font-weight: 600; width: min(560px, 100%); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
.pill.waiting { background: var(--wait-soft); color: var(--wait); }
.pill.busy { background: var(--busy-soft); color: var(--busy); }
.pill.review { background: var(--review-soft); color: var(--review); }
.pill.idle { background: var(--idle-soft); color: var(--muted); }
.pill.done { background: var(--add-bg); color: var(--add); }
.chat { flex: 1; overflow: auto; padding: 16px 20px 30px; }
.chat-inner { max-width: 900px; margin: 0 auto; }
.msg { margin-bottom: 14px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.msg .who b { color: var(--text); }
.msg.user .body { background: var(--user-bg); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 10px; padding: 8px 12px; }
.msg.assistant .body { padding: 0 2px; }
.waitbar { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--wait-soft); color: var(--wait); font-weight: 500; }
.loadmore { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 12px; }

/* markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; }
.md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; } .md h3 { font-size: 14px; } .md h4 { font-size: 13px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md code { font: 12px ui-monospace, Menlo, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow: auto; margin: 0 0 8px; }
.md .codebox { position: relative; margin: 0 0 8px; }
.md .codebox pre { margin: 0; white-space: pre-wrap; word-break: break-word; padding-right: 92px; }
.md .codebox pre.plain, .md .codebox pre.plain code { font: inherit; line-height: 1.55; }
/* Подпись — через CSS: так она не попадает в innerText, когда копируют всё сообщение. */
.md .codebox .copy::after { content: 'Копировать'; }
.md .codebox .copy { position: absolute; top: 6px; right: 6px; font-size: 11.5px; padding: 1px 8px; opacity: .75; }
.md .codebox .copy:hover { opacity: 1; }
.msg .who .copy-msg { font-size: 11.5px; padding: 0 6px; opacity: 0; }
.msg:hover .who .copy-msg, .msg .who .copy-msg:focus { opacity: 1; }
@media (hover: none) { .msg .who .copy-msg { opacity: .7; } }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 0 0 8px; display: block; overflow: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--panel2); }
.md blockquote { margin: 0 0 8px; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); }

/* инструменты */
details.tools { margin: -4px 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
details.tools > summary { padding: 5px 10px; cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: flex; gap: 8px; align-items: center; }
details.tools > summary::before { content: '▸'; } details.tools[open] > summary::before { content: '▾'; }
details.tools > summary .names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
details.tool { border-top: 1px solid var(--line); }
details.tool > summary { padding: 3px 10px 3px 22px; cursor: pointer; font-size: 12px; list-style: none; display: grid; grid-template-columns: 16px 130px 1fr auto; gap: 6px; align-items: center; }
details.tool > summary .tn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.tool > summary .ta { font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.ok { color: var(--busy); } .err { color: var(--del); } .pend { color: var(--wait); }
.io { margin: 0 10px 8px 22px; }
.io .lbl { font-size: 11px; color: var(--muted); margin: 6px 0 2px; text-transform: uppercase; }
.io pre { margin: 0; background: var(--code-bg); border-radius: 6px; padding: 6px 8px; font: 11.5px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
.ask { border: 1px solid color-mix(in srgb, var(--wait) 45%, var(--line)); background: var(--wait-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.ask .q { font-weight: 600; margin: 4px 0; }
.ask ul { margin: 0 0 4px; padding-left: 20px; }

/* правая панель */
.side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 5px 10px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabbody { flex: 1; overflow: auto; padding: 12px 14px 30px; }
.props { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: baseline; }
.props .k { color: var(--muted); font-size: 12px; }
.props .v { min-width: 0; overflow-wrap: anywhere; }
.props code { font: 11.5px ui-monospace, Menlo, monospace; }
.props a, .crumbs a { color: var(--accent); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
.task { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
details.issue { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
details.issue > summary { cursor: pointer; line-height: 1.45; }
details.issue[open] > summary { margin-bottom: 6px; }
details.issue .imeta { font-size: 11.5px; margin: 4px 0; }
details.issue .imeta a { color: var(--accent); }
details.issue .idesc { max-height: 60vh; overflow: auto; border-top: 1px solid var(--line); padding-top: 6px; }
.task .th { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.task a { color: var(--accent); }
.task .th a { font-weight: 600; }
.task .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 6px 0; overflow: hidden; }
.task .bar i { display: block; height: 100%; background: var(--ok, #2da44e); }
.todo { list-style: none; margin: 4px 0 8px; padding: 0; font-size: 12.5px; }
.todo li { display: flex; gap: 6px; padding: 1px 0; }
.todo li.done { color: var(--muted); }
.todo li .m { flex: none; width: 14px; }
.wl { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; margin: 6px 0; font-size: 12.5px; }
.wl.mine { border-color: var(--accent); }
.wl summary { cursor: pointer; color: var(--muted); }
.wl .lbl { font-weight: 600; margin-top: 4px; }
.tline { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 11.5px; }
.titem { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.tst { border-radius: 4px; padding: 0 6px; font-weight: 600; background: var(--chip); color: var(--muted); }
.tst.t-inProgress { background: color-mix(in srgb, #3b82f6 18%, transparent); color: #60a5fa; }
.tst.t-review { background: color-mix(in srgb, #a855f7 18%, transparent); color: #c084fc; }
.tst.t-paused { background: color-mix(in srgb, #f59e0b 18%, transparent); color: #f59e0b; }
.tst.t-done { background: color-mix(in srgb, #22c55e 18%, transparent); color: #22c55e; }
.tst.t-cancelled { text-decoration: line-through; }
.tkey { color: var(--accent); font-weight: 600; }
.tprog { color: var(--muted); font-variant-numeric: tabular-nums; }
h3 { font-size: 11.5px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
h3:first-child { margin-top: 0; }
.repo { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.repo .head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.files { margin: 4px 0 0; padding: 0; list-style: none; font: 11.5px ui-monospace, Menlo, monospace; }
.files li { display: flex; gap: 6px; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
.files li:hover { background: var(--accent-soft); }
.files .code { width: 18px; color: var(--muted); flex: none; }
.files .f { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.add { color: var(--add); } .del { color: var(--del); }
.commits { font-size: 12px; margin: 4px 0 0; padding: 0; list-style: none; }
.commits li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commits code { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.ev { display: grid; grid-template-columns: 40px 1fr; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.ev .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.p .x { color: var(--accent); }

/* diff поверх всего */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; z-index: 10; }
.overlay .win { background: var(--panel); border-radius: 10px; width: min(1200px, 100%); max-height: calc(100vh - 80px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); }

<body>
<header>
  <h1>dev-cockpit</h1>
  <nav>
    <a href="#/board" data-view="board">Доска</a>
    <a href="#/inbox" data-view="inbox">Входящие <span id="inboxBadge"></span></a>
    <a href="#/plan" data-view="plan">План</a>
    <a href="#/rules" data-view="rules">Правила <span id="rulesBadge"></span></a>
    <a href="#/day" data-view="day" title="Что сделано за сутки с 12:00 до 12:00 МСК">Сутки</a>
  </nav>
  <span id="stale"></span>
  <div class="spacer"></div>
  <span id="boardTools"></span>
  <input type="search" id="q" placeholder="Поиск: задача, имя, текст…">
  <button id="openTask" title="Открыть в VS Code новую вкладку Claude с /start-task КЛЮЧ — отправить Enter там">▶ Задача в VS Code</button>
  <button id="autoname" title="Придумать имена сессиям без имени (Haiku через claude -p)">✨ Имена</button>
  <span id="syncPill" class="ghost" hidden></span>
  <button id="notifyBtn" class="ghost" title="Уведомления, когда сессия ждёт ответа">🔕</button>
</header>
<div id="app"></div>

<script>
// ---------- утилиты ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOME = '/Users/vilch';
const short = p => String(p || '').replace(HOME + '/Разработка/', '').replace(HOME, '~');
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('cockpit.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cockpit.' + k, JSON.stringify(v)); } catch {} },
};
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) return `${Math.round(s / 60)} мин`;
  if (s < 86400) return `${Math.round(s / 3600)} ч`;
  return `${Math.round(s / 86400)} д`;
}
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) : '';
const dayTime = ts => ts ? new Date(ts).toLocaleString('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.append(t); setTimeout(() => t.remove(), 1800);
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`Скопировано: ${label || text}`); } catch { prompt('Скопируй:', text); }
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

// Markdown → безопасный HTML. Если CDN недоступен — показываем текст как есть.
const hasMd = typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
if (hasMd) marked.setOptions({ gfm: true, breaks: true });
function md(text) {
  if (!hasMd) return `<div style="white-space:pre-wrap">${esc(text)}</div>`;
  const html = DOMPurify.sanitize(marked.parse(String(text || '')), { ADD_ATTR: ['target'] });
  return codeBoxes(html.replace(/<a /g, '<a target="_blank" rel="noopener" '));
}
// Блоки ``` — с кнопкой «Копировать» и переносом строк. Блок без языка (или text) — это обычно
// текст «вставить как есть»: показываем его обычным шрифтом, а не моноширинным.
function codeBoxes(html) {
  if (!html.includes('<pre')) return html;
  const t = document.createElement('template'); t.innerHTML = html;
  for (const pre of t.content.querySelectorAll('pre')) {
    const lang = pre.querySelector('code')?.className.match(/language-(\S+)/)?.[1];
    if (!lang || /^(text|txt|plain|plaintext|markdown|md)$/i.test(lang)) pre.classList.add('plain');
    const box = document.createElement('div'); box.className = 'codebox';
    pre.replaceWith(box); box.append(pre);
    box.insertAdjacentHTML('afterbegin', '<button class="copy" data-copy="pre" title="Скопировать блок"></button>');
  }
  return t.innerHTML;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Скопировано');
}
document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-copy]'); if (!b) return;
  e.stopPropagation();
  const src = b.dataset.copy === 'pre' ? b.closest('.codebox')?.querySelector('pre') : b.closest('.msg')?.querySelector('.body');
  if (src) copyText(src.innerText.trim());
});
const plain = text => String(text || '').replace(/```[\s\S]*?```/g, ' [код] ').replace(/[*_`#>|]/g, '').replace(/\s+/g, ' ').trim();

// ---------- состояние ----------
let sessions = [], projects = [], queues = {}, pending = [], lastOk = 0, planVersionSeen = 0;
let seen = store.get('seen', {});           // sessionId → lastActivity, которую я уже видел
let prevStatus = {};
const notified = new Set();
let groupBy = store.get('groupBy', 'project');
let showCold = store.get('showCold', true);
let collapsed = store.get('collapsed', {});
let notifyOn = store.get('notify', false) && 'Notification' in window && Notification.permission === 'granted';

const LANES = [
  { key: 'waiting', label: 'Ждёт меня' },
  { key: 'busy', label: 'Работает' },
  { key: 'review', label: 'Готово, посмотреть' },
  { key: 'idle', label: 'Простаивает', cold: true },
  { key: 'done', label: 'Завершено', cold: true },
];
const LANE_LABEL = Object.fromEntries(LANES.map(l => [l.key, l.label]));
// Сессия что-то сделала после последнего просмотра (за неделю).
const unseen = s => s.lastActivity && s.lastActivity > (seen[s.sessionId] || 0) && Date.now() - s.lastActivity < 7 * 86400e3;
// «Завершено» — задачи сессии закрыты в Трекере и сессия ничего не делает и не ждёт.
function laneOf(s) {
  if (s.status === 'waiting' || s.requests?.length) return 'waiting';
  if (s.status === 'busy') return 'busy';
  if (s.taskClosed) return 'done';
  if (unseen(s)) return 'review';
  return 'idle';
}
// «Закончили, не смотрел» во «Входящих» — и завершённые, если в них есть непросмотренное.
const toReview = s => laneOf(s) === 'review' || (laneOf(s) === 'done' && unseen(s));
function markSeen(s) {
  if (!s?.lastActivity) return;
  if ((seen[s.sessionId] || 0) >= s.lastActivity) return;
  seen[s.sessionId] = s.lastActivity; store.set('seen', seen);
}

// ---------- роутинг ----------
function route() {
  const h = location.hash.slice(1) || '/board';
  const [, view, id] = h.split('/');
  return { view: view || 'board', id };
}
window.addEventListener('hashchange', () => render(true));

// ---------- загрузка ----------
async function poll() {
  try {
    const data = await (await fetch('/api/sessions')).json();
    sessions = data.sessions; projects = data.projects; queues = data.queues || {}; pending = data.pending || []; lastOk = Date.now();
    // План поменяли (здесь или из Mini App) — перечитать вкладку «План», не дожидаясь минутного опроса.
    if (data.planVersion && planVersionSeen && data.planVersion !== planVersionSeen) for (const st of Object.values(planData)) st.at = 0;
    planVersionSeen = data.planVersion;
    // Связь с Telegram (tg-planer): пилюля видна, только когда синк включён в data/sync.json.
    const sp = $('#syncPill'), sy = data.sync || {};
    sp.hidden = !sy.enabled;
    sp.textContent = sy.lastError ? '📱 ✕' : '📱';
    sp.title = sy.lastError ? `Синк с Telegram: ${sy.lastError}` : `Синк с Telegram: ${sy.lastOk ? new Date(sy.lastOk).toLocaleTimeString() : 'ещё не было'}`;
    for (const s of sessions) {
      if (s.status === 'waiting' && prevStatus[s.sessionId] && prevStatus[s.sessionId] !== 'waiting' && notifyOn) {
        new Notification(`Ждёт ответа: ${s.title}`, { body: s.waitingFor || '', tag: s.sessionId });
      }
      prevStatus[s.sessionId] = s.status;
    }
    // Новые сессии считаем просмотренными, чтобы при первом запуске всё не оказалось «на проверку».
    if (!store.get('seenInit', false)) { for (const s of sessions) seen[s.sessionId] = s.lastActivity || 0; store.set('seen', seen); store.set('seenInit', true); }
  } catch (e) { console.error(e); }
  render(false);
}

function render(force) {
  if (!force && typingInRequest()) return;
  const r = route();
  if (r.view !== 'day') delete $('#app').dataset.dayHtml;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.view === r.view));
  const inboxN = sessions.filter(s => laneOf(s) === 'waiting' || toReview(s)).length;
  if (pending.length && notifyOn) for (const r of pending) if (!notified.has(r.id)) { notified.add(r.id); new Notification(`${r.kind === 'question' ? 'Вопрос' : 'Разрешение'}: ${sessions.find(x => x.sessionId === r.sessionId)?.title || ''}`, { body: reqSummary(r).slice(0, 200), tag: r.id }); }
  const waitN = sessions.filter(s => s.status === 'waiting').length;
  $('#inboxBadge').innerHTML = inboxN ? `<span class="badge">${inboxN}</span>` : '';
  document.title = (waitN ? `(${waitN}) ` : '') + 'dev-cockpit';
  $('#stale').innerHTML = lastOk && Date.now() - lastOk > 15000 ? '<span class="stale">нет связи с сервером</span>' : '';
  const unnamed = sessions.filter(s => s.nameSource === 'derived').length;
  const namingN = sessions.filter(s => s.naming).length;
  $('#autoname').innerHTML = namingN ? `<span class="spin"></span> ${namingN}` : `✨ Имена${unnamed ? ` (${unnamed})` : ''}`;
  $('#autoname').disabled = !!namingN || !unnamed;
  $('#boardTools').innerHTML = r.view === 'board' ? `
    <span class="seg"><button data-group="project" class="${groupBy === 'project' ? 'on' : ''}">По проектам</button><button data-group="none" class="${groupBy === 'none' ? 'on' : ''}">Все вместе</button></span>
    <label class="muted" style="margin-left:8px"><input type="checkbox" id="showCold" ${showCold ? 'checked' : ''}> простаивающие</label>
    ${sessions.some(s => s.closable) ? `<button class="ghost" id="closeAll" title="Задача закрыта в Трекере и план заметки выполнен">✕ закрыть готовые (${sessions.filter(s => s.closable).length})</button>` : ''}`
    : r.view === 'plan' ? `
    <span class="seg"><button data-plan-scope="mine" class="${planScope === 'mine' ? 'on' : ''}" title="Открытые задачи, где я исполнитель, и заведённые мной без исполнителя">Мои</button><button data-plan-scope="all" class="${planScope === 'all' ? 'on' : ''}" title="Все открытые задачи очередей проекта">Все открытые</button></span>
    <button class="ghost" data-plan-refresh title="Перечитать задачи из Трекера">↻</button>`
    : r.view === 'day' ? `
    <span class="seg"><button data-day-shift="-1" title="Предыдущие сутки">‹</button><button data-day-shift="0" title="Текущие сутки">сейчас</button><button data-day-shift="1" title="Следующие сутки">›</button></span>
    <button class="ghost" data-day-refresh title="Пересчитать сейчас (сам пересчёт идёт раз в час)">↻</button>` : '';
  $('#notifyBtn').textContent = notifyOn ? '🔔' : '🔕';
  if (r.view === 'session') return renderSession(r.id, force);
  sessView = null;
  if (r.view !== 'plan') lastPlanHtml = '';
  if (r.view === 'plan') return renderPlan();
  if (r.view !== 'rules') delete $('#app').dataset.rulesHtml;
  if (Date.now() - rulesAt > (r.view === 'rules' ? 15_000 : 120_000)) loadRules();
  $('#rulesBadge').innerHTML = rulesData?.suggestions.length ? `<span class="badge">${rulesData.suggestions.length}</span>` : '';
  if (r.view === 'rules') return renderRules();
  if (r.view === 'day') return renderDay(r.id);
  if (r.view === 'inbox') return renderInbox();
  return renderBoard();
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  if (!q) return sessions;
  return sessions.filter(s => [s.title, s.taskKey, s.project, s.gitBranch, s.lastPrompt, s.claudeName].join(' ').toLowerCase().includes(q));
}
const byActivity = (a, b) => (b.lastActivity || 0) - (a.lastActivity || 0);

// ---------- запросы сессий ----------
// Набранное в формах запросов живёт здесь, чтобы не терялось при перерисовке раз в 3 с.
const drafts = {};
const reqSummary = r => r.kind === 'question'
  ? (r.input.questions || []).map(q => q.question).join(' / ')
  : r.input.command || r.input.file_path || r.input.url || r.input.query || r.input.sql || JSON.stringify(r.input);

// Режимы Claude Code так, как они названы в меню VS Code.
const MODES = { default: 'Manual', manual: 'Manual', acceptEdits: 'Edit automatically', plan: 'Plan', auto: 'Auto', bypassPermissions: 'Bypass', dontAsk: "Don't ask" };
const modeName = m => MODES[m] || m;
// Режим из транскрипта (последняя реплика) или из запроса — переключение Shift+Tab без сообщения видно не сразу.
const modeChip = m => m ? `<span class="chip mode-${esc(m)}" title="Режим сессии">${esc(modeName(m))}</span>` : '';
// Выбор «режим после ответа»: режим сессии можно поменять только вместе с ответом на запрос.
function modeSelect(r) {
  const cur = drafts[`${r.id}|mode`] || '';
  const opts = ['default', 'acceptEdits', 'plan', 'auto'].filter(m => m !== r.mode)
    .map(m => `<option value="${m}" ${cur === m ? 'selected' : ''}>→ ${esc(modeName(m))}</option>`).join('');
  return `<label class="modepick" title="Режим сессии меняется вместе с ответом">после ответа
    <select class="${cur ? 'on' : ''}" data-draft-text="${r.id}|mode"><option value="">режим не менять</option>${opts}</select></label>`;
}

// Контекст запроса: развёрнутые реплики (переживают перерисовку) и всплывающее окно с хвостом переписки.
const ctxOpen = new Set();
const ctxCache = new Map(); // sessionId -> { at, html }
let ctxFor = null, ctxHideTimer = null;
function ctxPop() {
  let el = document.getElementById('ctxPop');
  if (!el) { el = document.createElement('div'); el.id = 'ctxPop'; document.body.append(el); }
  return el;
}
function placeCtx(el, anchor) {
  const a = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(a.left, innerWidth - w - 16), top = a.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, a.top - h - 6);
  el.style.left = Math.max(16, left) + 'px'; el.style.top = top + 'px';
}
async function showCtx(anchor) {
  const id = anchor.dataset.ctx, el = ctxPop();
  clearTimeout(ctxHideTimer);
  if (ctxFor === id && el.style.display === 'block') return;
  ctxFor = id;
  const hit = ctxCache.get(id);
  el.innerHTML = hit ? hit.html : '<div class="muted">Загружаю…</div>';
  el.style.display = 'block'; placeCtx(el, anchor);
  if (hit && Date.now() - hit.at < 10_000) return;
  try {
    const r = await fetch(`/api/context?id=${encodeURIComponent(id)}&n=8`);
    const d = await r.json();
    const html = (d.items || []).map(m => `<div class="cm ${m.kind}">
      <div class="who">${m.kind === 'user' ? (m.via === 'cockpit' ? 'Я · из cockpit' : m.via === 'peer' ? 'Соседняя сессия' : 'Я') : 'Claude'} · ${hhmm(m.ts)}${m.toolsAfter ? ` · дальше ${m.toolsAfter} действ.` : ''}</div>
      ${m.kind === 'assistant' ? md(m.text) : `<div style="white-space:pre-wrap">${esc(m.text)}</div>`}</div>`).join('') || '<div class="muted">Сообщений нет</div>';
    ctxCache.set(id, { at: Date.now(), html });
    if (ctxFor === id) { el.innerHTML = html; el.scrollTop = el.scrollHeight; placeCtx(el, anchor); }
  } catch { if (ctxFor === id) el.innerHTML = '<div class="muted">Не удалось загрузить</div>'; }
}
function hideCtxSoon() {
  clearTimeout(ctxHideTimer);
  ctxHideTimer = setTimeout(() => { ctxPop().style.display = 'none'; ctxFor = null; }, 250);
}
document.addEventListener('mouseover', e => {
  const b = e.target.closest?.('[data-ctx]');
  if (b) return showCtx(b);
  if (e.target.closest?.('#ctxPop')) return clearTimeout(ctxHideTimer);
  if (ctxFor) hideCtxSoon();
});
document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-ctx]');
  if (b) { e.stopPropagation(); return ctxFor === b.dataset.ctx ? hideCtxSoon() : showCtx(b); }
  const t = e.target.closest?.('[data-ctx-toggle]');
  if (t) { const id = t.dataset.ctxToggle; ctxOpen.has(id) ? ctxOpen.delete(id) : ctxOpen.add(id); t.classList.toggle('open'); return; }
  if (ctxFor && !e.target.closest?.('#ctxPop')) hideCtxSoon();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ctxFor) hideCtxSoon(); });

function requestHtml(r, opts = {}) {
  const s = sessions.find(x => x.sessionId === r.sessionId);
  const head = `<div class="rh">${r.kind === 'question' ? '❓' : '🔐'} <b>${esc(r.kind === 'question' ? 'Claude спрашивает' : r.tool)}</b>
    ${opts.withSession && s ? `<a href="#/session/${esc(r.sessionId)}">${esc(s.title)}</a> <span class="chip">${esc(s.project)}</span>` : ''}
    <span class="time">${ago(r.createdAt)} назад</span>${modeChip(r.mode)}
    ${opts.withSession ? `<span class="ctxbtn" data-ctx="${esc(r.sessionId)}" title="Последние сообщения сессии">💬</span>` : ''}</div>
    ${opts.withSession && s?.lastAssistant ? `<div class="ctx${ctxOpen.has(r.id) ? ' open' : ''}" data-ctx-toggle="${r.id}" title="Последняя реплика Claude перед запросом — клик разворачивает">${esc(s.lastAssistant)}</div>` : ''}`;
  if (r.kind === 'question') {
    const qs = (r.input.questions || []).map((q, qi) => {
      const picked = drafts[`${r.id}|${qi}`] || [];
      const type = q.multiSelect ? 'checkbox' : 'radio';
      return `<div class="q">${esc(q.question)}</div>
        ${(q.options || []).map(o => `<label class="opt"><input type="${type}" name="${r.id}-${qi}" data-draft="${r.id}|${qi}" value="${esc(o.label)}" ${picked.includes(o.label) ? 'checked' : ''}>
          <span><b>${esc(o.label)}</b>${o.description ? `<div class="d">${esc(o.description)}</div>` : ''}</span></label>`).join('')}
        <input type="text" placeholder="Свой вариант" data-draft-text="${r.id}|other|${qi}" value="${esc(drafts[`${r.id}|other|${qi}`] || '')}" style="width:100%;margin-top:4px">`;
    }).join('');
    return `<div class="req" data-req="${r.id}">${head}${qs}
      <div class="acts"><button class="allow" data-decide="answer" data-id="${r.id}">Ответить</button>${modeSelect(r)}
      <span class="muted" style="font-size:12px">или ответь в окне сессии — сработает первый ответ</span></div></div>`;
  }
  const body = r.tool === 'Bash' && r.input.command
    ? `${r.input.description ? `<div class="muted" style="margin-bottom:4px">${esc(r.input.description)}</div>` : ''}<pre>${esc(r.input.command)}</pre>`
    : `<pre>${esc(JSON.stringify(r.input, null, 2))}</pre>`;
  return `<div class="req" data-req="${r.id}">${head}${body}
    <div class="acts">
      <button class="allow" data-decide="allow" data-id="${r.id}">Разрешить</button>
      ${Array.isArray(r.suggestions) && r.suggestions.length ? `<button data-decide="always" data-id="${r.id}" title="${esc(JSON.stringify(r.suggestions))}">Разрешить всегда</button>` : ''}
      ${modeSelect(r)}
      <input type="text" placeholder="Причина отказа (необязательно)" data-draft-text="${r.id}|reason" value="${esc(drafts[`${r.id}|reason`] || '')}">
      <button class="deny" data-decide="deny" data-id="${r.id}">Отклонить</button>
    </div></div>`;
}

async function decideRequest(id, kind) {
  const all = sessions.flatMap(s => s.requests || []);
  const r = all.find(x => x.id === id);
  const body = { id };
  if (kind === 'deny') { body.behavior = 'deny'; body.message = drafts[`${id}|reason`] || undefined; }
  else if (kind === 'answer') {
    body.behavior = 'allow'; body.answers = {};
    (r?.input.questions || []).forEach((q, qi) => {
      const other = (drafts[`${id}|other|${qi}`] || '').trim();
      const picked = drafts[`${id}|${qi}`] || [];
      // Один вариант: свой текст заменяет отмеченный пункт. Несколько — добавляется к ним.
      if (q.multiSelect) { const val = other ? [...picked, other] : picked; if (val.length) body.answers[q.question] = val; }
      else if (other || picked.length) body.answers[q.question] = other || picked[0];
    });
    if (Object.keys(body.answers).length < (r?.input.questions || []).length) { toast('Ответь на все вопросы'); return; }
  } else { body.behavior = 'allow'; body.always = kind === 'always'; }
  if (body.behavior === 'allow' && drafts[`${id}|mode`]) body.setMode = drafts[`${id}|mode`];
  try {
    await post('/api/requests/decision', body);
    toast((body.behavior === 'deny' ? 'Отклонено' : kind === 'answer' ? 'Ответ отправлен' : 'Разрешено') + (body.setMode ? ` · режим → ${modeName(body.setMode)}` : ''));
  } catch (e) { toast('Не успел: ' + e.message); }
  for (const k of Object.keys(drafts)) if (k.startsWith(id + '|')) delete drafts[k];
  poll();
}
// Пока пользователь печатает в форме запроса, экран не перерисовываем — иначе пропадёт фокус.
const typingInRequest = () => !!document.activeElement?.closest?.('.req') && (document.activeElement.type === 'text' || document.activeElement.tagName === 'SELECT');

// ---------- доска ----------
// Строка задач сессии: статус в Трекере и план из заметки start-task («☑ 8/9», в подсказке — что
// осталось). Видна и в компактных строках «всё простаивает», где подвал карточки скрыт.
function taskLine(s) {
  const plans = Object.fromEntries((s.tasks || []).map(t => [t.issue || t.title, t]));
  const keys = [...new Set([s.taskKey, ...Object.keys(plans)].filter(Boolean))];
  const items = keys.map(k => {
    const st = s.trackerStatus?.[k], t = plans[k];
    if (!st && !t?.total) return '';
    const showKey = keys.length > 1 || !s.title.includes(k);
    const tip = [st ? `${k}: ${st.display}${st.resolution ? ` (${st.resolution})` : ''}` : k,
      t?.total ? `план: сделано ${t.done} из ${t.total}` : '', t?.left ? `Осталось: ${t.left}` : ''].filter(Boolean).join('\n');
    return `<span class="titem" title="${esc(tip)}">${st ? `<span class="tst t-${esc(st.type || 'new')}">${esc(st.display)}</span>` : ''}${showKey ? `<span class="tkey">${esc(k)}</span>` : ''}${t?.total ? `<span class="tprog">${t.done === t.total ? '✅' : '☑'} ${t.done}/${t.total}</span>` : ''}</span>`;
  }).join('');
  return items ? `<div class="tline">${items}</div>` : '';
}

// Прогресс планов задач сессии: полоса и первый невыполненный пункт (для «Входящих»).
function planHtml(s) {
  const plans = (s.tasks || []).filter(t => t.total);
  return plans.map(t => {
    const pct = Math.round(t.done / t.total * 100);
    const many = plans.length > 1 && t.issue ? `<span class="tkey">${esc(t.issue)}</span>` : '';
    const tail = t.done === t.total ? '<span class="pdone">план выполнен</span>'
      : t.next ? `<span class="pnext" title="${esc(t.next)}">дальше: ${esc(plain(t.next))}</span>` : '';
    // Число «x/y» уже есть в строке задач над полосой — здесь только полоса и следующий пункт.
    return `<div class="plan" title="план: сделано ${t.done} из ${t.total}">${many}<span class="pbar"><i style="width:${pct}%"></i></span>${tail}</div>`;
  }).join('');
}

// Названия задач из Трекера под строкой статусов и кнопка быстрого просмотра описания.
function summaryHtml(s) {
  const keys = [...new Set([s.taskKey, ...(s.tasks || []).map(t => t.issue)].filter(Boolean))]
    .filter(k => s.trackerStatus?.[k]?.summary);
  return keys.map(k => `<div class="tsum" title="${esc(`${k}: ${s.trackerStatus[k].summary}`)}">${keys.length > 1 ? `<span class="tkey">${esc(k)}</span> ` : ''}<span class="txt">${esc(s.trackerStatus[k].summary)}</span><button class="ghost peek" data-peek="${esc(k)}" title="Описание задачи из Трекера">описание</button></div>`).join('');
}

function cardHtml(s, lane) {
  const repos = (s.repos || []).filter(r => !r.endsWith('/Документация')).slice(0, 3).map(r => `<span class="chip">${esc(r.split('/').pop())}</span>`).join('');
  const rq = s.requests?.[0];
  const why = rq ? `<div class="why req-line">${rq.kind === 'question' ? '❓' : '🔐'} ${esc(rq.kind === 'question' ? 'вопрос' : rq.tool)}: ${esc(reqSummary(rq).slice(0, 120))}</div>`
    : s.status === 'waiting' ? `<div class="why waiting">⏳ ${esc(s.waitingFor || 'ждёт ответа')}</div>` : '';
  return `<div class="card ${lane}" data-open="${s.sessionId}">
    <div class="row"><span class="dot ${lane}"></span><span class="title ${s.nameSource === 'derived' ? 'derived' : ''}">${s.naming ? '<span class="spin"></span> ' : ''}${esc(s.title)}</span><span class="time">${ago(s.lastActivity)}</span></div>
    ${taskLine(s)}
    ${summaryHtml(s)}
    ${why}
    ${nextCloseHtml(s)}
    <div class="prompt">${esc(plain(s.lastPrompt).slice(0, 240))}</div>
    <div class="foot">${modeChip(s.permissionMode)}${s.taskKey && !s.title.includes(s.taskKey) && !s.trackerStatus?.[s.taskKey] ? `<span class="chip key">${esc(s.taskKey)}</span>` : ''}${groupBy === 'none' ? `<span class="chip">${esc(s.project)}</span>` : ''}${s.filesCount ? `<span class="chip">✎ ${s.filesCount}</span>` : ''}${repos}</div>
  </div>`;
}

function colsHtml(list) {
  const lanes = LANES.filter(l => showCold || !l.cold);
  return `<div class="cols ${showCold ? '' : 'nocold'}">${lanes.map(l => {
    const items = list.filter(s => laneOf(s) === l.key).sort(byActivity);
    return `<div class="col ${l.cold ? 'cold' : ''}">
      <div class="colhead"><span class="dot ${l.key}"></span>${l.label} <span class="n">${items.length}</span></div>
      ${items.map(s => cardHtml(s, l.key)).join('') || '<div class="placeholder"></div>'}
    </div>`;
  }).join('')}</div>`;
}

function renderBoard() {
  const list = filtered();
  const app = $('#app'); const scroll = app.scrollTop;
  if (!sessions.length) { app.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  if (groupBy === 'none') {
    app.innerHTML = `<div class="board">${boardRequests()}${colsHtml(list)}</div>`;
  } else {
    const groups = {};
    for (const s of list) (groups[s.project] ||= []).push(s);
    // Сверху — проекты, где что-то ждёт меня или идёт работа, дальше по свежести.
    const weight = g => (g.some(s => s.status === 'waiting') ? 2 : 0) + (g.some(s => s.status === 'busy') ? 1 : 0);
    const names = Object.keys(groups).sort((a, b) => weight(groups[b]) - weight(groups[a]) || Math.max(...groups[b].map(s => s.lastActivity || 0)) - Math.max(...groups[a].map(s => s.lastActivity || 0)));
    app.innerHTML = `<div class="board">${boardRequests()}${names.map(p => {
      const g = groups[p];
      const cnt = k => g.filter(s => laneOf(s) === k).length;
      const stats = [['waiting', 'ждёт'], ['busy', 'работает'], ['review', 'посмотреть']].filter(([k]) => cnt(k)).map(([k, t]) => `<span class="pill ${k}">${cnt(k)} ${t}</span>`).join(' ');
      // В проекте всё простаивает — без сетки колонок, одной строкой компактных карточек.
      const quiet = !stats;
      if (quiet && !showCold) return '';
      return `<section class="lane ${collapsed[p] ? 'collapsed' : ''} ${quiet ? 'quiet' : ''}">
        <div class="lanehead" data-lane="${esc(p)}"><span class="caret">${collapsed[p] ? '▸' : '▾'}</span><h2>${esc(p)}</h2><span class="muted">${g.length} сесс.${quiet ? ' · всё простаивает' : ''}</span>${stats}</div>
        ${quiet ? `<div class="cols quietrow">${g.sort(byActivity).map(s => cardHtml(s, 'idle')).join('')}</div>` : colsHtml(g)}
      </section>`;
    }).join('') || '<div class="empty">Ничего не найдено</div>'}</div>`;
  }
  app.scrollTop = scroll;
}

function boardRequests() {
  if (!pending.length) return '';
  return `<section class="lane" style="background:var(--wait-soft)"><div class="lanehead"><h2>Ждут решения · ${pending.length}</h2></div>${pending.map(r => requestHtml(r, { withSession: true })).join('')}</section>`;
}

// ---------- входящие ----------
function renderInbox() {
  const list = filtered();
  const waiting = list.filter(s => laneOf(s) === 'waiting').sort(byActivity);
  const review = list.filter(toReview).sort(byActivity);
  const busy = list.filter(s => laneOf(s) === 'busy').sort(byActivity);
  const row = (s, lane) => `<div class="irow" data-open="${s.sessionId}">
    <span class="dot ${lane}"></span>
    <div><div class="t">${esc(s.title)} <span class="chip">${esc(s.project)}</span> ${modeChip(s.permissionMode)}</div>
      ${taskLine(s)}${summaryHtml(s)}${planHtml(s)}${nextCloseHtml(s)}
      <div class="ex">${lane === 'waiting' ? `<b style="color:var(--wait)">⏳ ${esc(s.waitingFor || 'ждёт ответа')}.</b> ` : ''}${esc(plain(s.lastAssistant || s.lastPrompt).slice(0, 400))}</div></div>
    <div class="side"><span class="time">${ago(s.lastActivity)}</span>${lane === 'review' ? `<button class="ghost" data-seen="${s.sessionId}">✓ просмотрено</button>` : ''}</div>
  </div>`;
  const app = $('#app'); const scroll = app.scrollTop; const actScroll = app.querySelector('.icol.act')?.scrollTop || 0;
  // Слева — то, что идёт само (работают, закончили); справа — то, что ждёт моего действия.
  app.innerHTML = `<div class="inbox">
    <div class="icol">
      <h2>Работают сейчас · ${busy.length}</h2>${busy.map(s => row(s, 'busy')).join('') || '<div class="muted">—</div>'}
      <h2>Закончили, не смотрел · ${review.length} ${review.length ? '<button class="ghost" id="seenAll">отметить все</button>' : ''}</h2>${review.map(s => row(s, 'review')).join('') || '<div class="muted">Всё просмотрено</div>'}
    </div>
    <div class="icol act${pending.length || waiting.length ? ' has' : ''}">
      ${pending.length ? `<h2>Запросы разрешений и вопросы · ${pending.length}</h2>${pending.map(r => requestHtml(r, { withSession: true })).join('')}` : ''}
      <h2>Ждут моего ответа · ${waiting.length}</h2>${waiting.map(s => row(s, 'waiting')).join('') || '<div class="muted">Никто не ждёт 🎉</div>'}
    </div>
  </div>`;
  app.scrollTop = scroll; app.querySelector('.icol.act').scrollTop = actScroll;
}

// «Дальше по плану» (сессия своё сделала) и «закрыть» (задача закрыта, план выполнен).
function nextCloseHtml(s) {

async function closeSessionUi(ids) {

  const how = 'Вкладка VS Code покажет отключение, фоновая сессия остановится; переписка сохранится — продолжить можно из истории (claude --resume).';

// ---------- сутки 12:00–12:00 МСК ----------
// Сервер пересчитывает текущие сутки раз в час (↻ — сразу), прошедшие — один раз. Здесь только
// перечитываем ответ раз в 10 минут, чтобы подхватить часовой пересчёт.
const dayData = {}; // date|'' -> { at, data, loading, error }
let currentDay = '';
const fmtH = ms => { const m = Math.round(ms / 60e3); return m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч${m % 60 ? ` ${m % 60} мин` : ''}`; };
const fmtDT = ts => new Date(ts).toLocaleString('ru', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' });
const shiftDate = (d, n) => new Date(Date.parse(`${d}T00:00:00Z`) + n * 86400e3).toISOString().slice(0, 10);

async function loadDay(date, fresh) {
  const k = date || '';
  const st = dayData[k] ||= {};
  if (st.loading) return;
  st.loading = true; st.error = null;
  if (route().view === 'day') renderDay(route().id);
  try {
    const res = await fetch(`/api/day?${new URLSearchParams({ ...(date ? { date } : {}), ...(fresh ? { fresh: '1' } : {}) })}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    st.data = data; st.at = Date.now();
    if (!date) currentDay = data.date;
  } catch (e) { st.error = e.message; st.at = Date.now(); }
  st.loading = false;
  if (route().view === 'day') renderDay(route().id);
}

function renderDay(date) {
  const st = dayData[date || ''];
  // Ошибку (например, cockpit ещё не перезапущен со свежим сервером) повторяем через 15 с, ответ — через 10 мин.
  if (!st || (!st.loading && Date.now() - (st.at || 0) > (st.error ? 15e3 : 600e3))) loadDay(date);
  const d = st?.data;
  const app = $('#app');
  if (!d) {
    delete app.dataset.dayHtml;
    app.innerHTML = `<div class="day"><div class="muted">${st?.error ? `Ошибка: ${esc(st.error)}` : '<span class="spin"></span> Считаю сутки: транскрипты сессий, git и Трекер — до 10–20 с…'}</div></div>`;
    return;
  }
  const card = t => {
    const trs = t.transitions.map(x => `${x.from ? `${esc(x.from)} → ` : ''}<b>${esc(x.to || '')}</b> ${hhmmMsk(x.at)}${x.by ? ` · ${esc(x.by)}` : ''}`).join('<br>');

    const left = t.worklog.filter(w => w.left).at(-1)?.left;
    return `<div class="dcard${t.done ? ' done' : ''}">
      <div class="dt"><a class="tkey" href="https://tracker.yandex.ru/${esc(t.key)}" target="_blank" rel="noopener">${esc(t.key)}</a>
        ${t.status ? `<span class="tst t-${esc(t.status.type || 'new')}">${esc(t.status.display)}</span>` : ''}
        ${t.project ? `<span class="chip">${esc(t.project)}</span>` : ''}
        <span class="hrs" title="Замеренное время сессий по задаче за сутки">${t.ms ? fmtH(t.ms) : '—'}</span></div>
      ${t.summary ? `<div class="sum">${esc(t.summary)}</div>` : ''}
      ${trs ? `<div class="trs">${trs}</div>` : ''}
      ${wl ? `<div class="wl" title="Нажми, чтобы развернуть">${wl}</div>` : ''}
      ${left ? `<div class="wl" title="Нажми, чтобы развернуть"><span class="lbl">Осталось:</span> ${esc(left)}</div>` : ''}
      ${t.commits.length ? `<details><summary>Коммиты · ${t.commits.length}</summary><div class="cm">${t.commits.map(c => `<code>${esc(c.hash)}</code><span class="muted">${hhmmMsk(c.at)} · ${esc(c.repo)}</span><span>${esc(c.subject)}</span>`).join('')}</div></details>` : ''}
      ${t.sessions.length ? `<div class="sess">${t.sessions.map(x => `<a class="chip" href="#/session/${esc(x.id)}" title="Открыть сессию">${esc(x.title.slice(0, 40))} · ${fmtH(x.ms)}</a>`).join('')}</div>` : ''}
    </div>`;
  };
  const done = d.tasks.filter(t => t.done), rest = d.tasks.filter(t => !t.done);
  const other = d.noTask.length || d.orphanCommits.length ? `<h2>Без задачи</h2><div class="day-grid">
    ${d.noTask.map(x => `<div class="dcard"><div class="dt"><a href="#/session/${esc(x.id)}">${esc(x.title)}</a>${x.project ? `<span class="chip">${esc(x.project)}</span>` : ''}<span class="hrs">${fmtH(x.ms)}</span></div></div>`).join('')}
    ${d.orphanCommits.length ? `<div class="dcard"><details open><summary>Коммиты без задачи · ${d.orphanCommits.length}</summary><div class="cm">${d.orphanCommits.map(c => `<code>${esc(c.hash)}</code><span class="muted">${hhmmMsk(c.at)} · ${esc(c.repo)}</span><span>${esc(c.subject)}</span>`).join('')}</div></details></div>` : ''}
  </div>` : '';
  const html = `<div class="day">
    <div class="day-head">
      <span class="range">${fmtDT(d.start)} → ${fmtDT(d.end)} МСК</span>
      <span class="tot">работа за сутки <b>${fmtH(d.totalMs)}</b>${d.sumMs > d.totalMs + 60e3 ? ` <span class="muted" title="Сессии шли параллельно — сумма по задачам больше календарного времени">· по задачам ${fmtH(d.sumMs)}</span>` : ''}</span>
      <span class="muted">задач ${d.tasks.length}, доведено ${done.length}</span>
      ${d.incomplete ? '<span class="stale" title="Часть задач Трекер не отдал — пересчёт через 5 мин или ↻">Трекер ответил не по всем задачам</span>' : ''}
      <span class="muted">${d.partial ? 'сутки идут · ' : ''}посчитано в ${hhmmMsk(d.computedAt)}${st.loading ? ' · <span class="spin"></span> пересчитываю' : ''}</span>
    </div>
    ${done.length ? `<h2>Доведены: тестирование, решено, закрыто · ${done.length}</h2><div class="day-grid">${done.map(card).join('')}</div>` : ''}
    ${rest.length ? `<h2>В работе · ${rest.length}</h2><div class="day-grid">${rest.map(card).join('')}</div>` : ''}

  if (app.dataset.dayHtml === html) return;
  const scroll = app.scrollTop;
  app.innerHTML = html; app.dataset.dayHtml = html;
  app.scrollTop = scroll;
}
const hhmmMsk = ts => new Date(ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' });

// ---------- план ----------
// Задачи проекта из Трекера (открытые в его очередях) и план — очерёдность, которую выставляю я.
// Порядок хранит сервер в data/plan.json; выборка Трекера перечитывается раз в минуту.
let planProjects = store.get('planProjects', []);
let planScope = store.get('planScope', 'mine');
const planData = {}; // проект -> { at, scope, loading, data, error }
let planDrag = null; // { key, project, fromPlan } — пока тащу карточку, экран не перерисовываем
let lastPlanHtml = '';
// Фильтры и сортировка списка «Задачи проекта» — свои у каждого проекта.
let planFilters = store.get('planFilters', {});
const PLAN_SORTS = [['smart', 'В работе сверху'], ['updated', 'Обновлены'], ['created', 'Созданы'], ['status', 'Статус'], ['priority', 'Приоритет'], ['key', 'Номер']];
const STATUS_RANK = { review: 0, inProgress: 1, paused: 2, new: 3 };
const pfOf = p => ({ statuses: [], types: [], sort: 'smart', desc: true, withSession: false, withNote: false, ...(planFilters[p] || {}) });
function setPf(p, patch) { planFilters[p] = { ...pfOf(p), ...patch }; store.set('planFilters', planFilters); render(false); }
const PLAN_POLL = 60_000;
const queueProjects = () => [...new Set(Object.values(queues))].sort();
const sessKeys = s => [s.taskKey, ...(s.tasks || []).map(t => t.issue)].filter(Boolean);
const sessionsOf = key => sessions.filter(s => sessKeys(s).includes(key)).sort(byActivity);

function loadPlan(p, fresh) {
  const st = (planData[p] ||= { at: 0 });
  if (st.loading) return;
  st.loading = true; st.scope = planScope;
  fetch('/api/plan?' + new URLSearchParams({ project: p, scope: planScope, ...(fresh ? { fresh: '1' } : {}) }))
    .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); st.data = j; st.error = j.error; })
    .catch(e => { st.error = e.message; })
    // Трекер не ответил (сеть, VPN) — повторяем через 10 с, а не через минуту.
    .finally(() => { st.loading = false; st.at = st.error ? Date.now() - PLAN_POLL + 10_000 : Date.now(); if (route().view === 'plan') render(false); });
}

async function setPlan(p, keys) {
  const d = planData[p]?.data; if (!d) return;
  d.plan = keys; lastPlanHtml = ''; render(false);
  try { await post('/api/plan', { project: p, keys }); }
  catch (e) { toast('План не сохранился: ' + e.message); loadPlan(p); }
}

function planRowHtml(i, d, o) {

    note.done === note.total ? '<span class="pdone">план выполнен</span>' : note.next ? `<span class="pnext" title="${esc(note.next)}">дальше: ${esc(plain(note.next))}</span>` : ''}</div>` : '';
  const sess = ss.map(s => { const l = laneOf(s); return `<span class="chip sess" data-open="${s.sessionId}" title="${esc(`${LANE_LABEL[l]}: ${s.title}`)}"><span class="dot ${l}"></span>${esc(s.title.slice(0, 40))}</span>`; }).join('');
  const meta = [i.type, i.priority, i.assignee, i.deadline && `срок ${i.deadline}`, i.updatedAt && `обновлена ${ago(new Date(i.updatedAt).getTime())} назад`].filter(Boolean).map(esc).join(' · ');
