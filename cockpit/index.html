const tsOf = t => (t ? new Date(t).getTime() : 0);
const keyNum = k => Number(k.split('-')[1]) || 0;
function sortPool(list, f) {
  // smart: сначала то, что уже в работе (сессия или статус), дальше — по свежести изменений в Трекере.
  const smart = i => (sessionsOf(i.key).length ? 0 : ['inProgress', 'review'].includes(i.status?.type) ? 1 : 2);
  const cmp = {
    smart: (a, b) => smart(a) - smart(b) || tsOf(b.updatedAt) - tsOf(a.updatedAt),
    updated: (a, b) => tsOf(a.updatedAt) - tsOf(b.updatedAt),
    created: (a, b) => tsOf(a.createdAt) - tsOf(b.createdAt),
    status: (a, b) => (STATUS_RANK[b.status?.type] ?? 4) - (STATUS_RANK[a.status?.type] ?? 4) || String(b.status?.display).localeCompare(String(a.status?.display), 'ru'),
    priority: (a, b) => (a.priorityOrder ?? 2) - (b.priorityOrder ?? 2),
    key: (a, b) => keyNum(a.key) - keyNum(b.key),
  }[f.sort] || (() => 0);
  // smart задан сразу в нужную сторону, у остальных направление — стрелкой.
  const dir = f.sort === 'smart' ? 1 : f.desc ? -1 : 1;
  return list.slice().sort((a, b) => dir * cmp(a, b) || tsOf(b.updatedAt) - tsOf(a.updatedAt));
}
function poolTools(p, base, d, f) {
  if (!base.length) return '';
  const count = by => base.reduce((m, i) => { const k = by(i); if (k) m.set(k, (m.get(k) || 0) + 1); return m; }, new Map());
  // Выбранное значение, которого в списке уже нет (задачи ушли в план), всё равно показываем с нулём —
  // иначе фильтр действует невидимо и список пустеет без причины.
  const keep = (m, sel) => { for (const v of sel) if (!m.has(v)) m.set(v, 0); return m; };
  const statuses = [...keep(count(i => i.status?.display), f.statuses)].sort((a, b) => {
    const t = x => STATUS_RANK[base.find(i => i.status?.display === x[0])?.status?.type] ?? 4;
    return t(a) - t(b) || b[1] - a[1];
  });
  const types = [...keep(count(i => i.type), f.types)];
  const stType = name => base.find(i => i.status?.display === name)?.status?.type || 'new';
  const chip = (attr, val, on, label, cls = '') => `<button class="pf ${on ? 'on' : ''} ${cls}" data-pf="${attr}" data-pf-val="${esc(val)}" data-pf-proj="${esc(p)}">${label}</button>`;
  const withSessionN = base.filter(i => sessionsOf(i.key).length).length, withNoteN = base.filter(i => d.notes[i.key]).length;
  const any = f.statuses.length || f.types.length || f.withSession || f.withNote;
  return `<div class="pl-tools">
    <div class="pl-trow">${statuses.map(([n, c]) => chip('status', n, f.statuses.includes(n), `<span class="tst t-${esc(stType(n))}">${esc(n)}</span> ${c}`)).join('')}</div>
    <div class="pl-trow">
      ${types.length > 1 || f.types.length ? types.map(([n, c]) => chip('type', n, f.types.includes(n), `${esc(n)} ${c}`)).join('') + '<span class="sep"></span>' : ''}
      ${withSessionN || f.withSession ? chip('withSession', '', f.withSession, `с сессией ${withSessionN}`) : ''}${withNoteN || f.withNote ? chip('withNote', '', f.withNote, `с планом ☑ ${withNoteN}`) : ''}
      ${any ? `<button class="ghost" data-pf="reset" data-pf-proj="${esc(p)}">сбросить</button>` : ''}
      <span class="spacer"></span>
      <label class="muted">сортировка <select data-pf-sort="${esc(p)}">${PLAN_SORTS.map(([k, l]) => `<option value="${k}" ${f.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${f.sort !== 'smart' ? `<button class="ghost" data-pf="desc" data-pf-proj="${esc(p)}" title="Направление сортировки">${f.desc ? '↓' : '↑'}</button>` : ''}
    </div>
  </div>`;
}

function planSection(p, q) {
  const st = planData[p];
  if (!st || (!st.loading && (st.scope !== planScope || Date.now() - st.at > PLAN_POLL))) loadPlan(p);
  const d = st?.data;
  const head = extra => `<div class="pl-head"><h2>${esc(p)}</h2><span class="muted">${esc(Object.keys(queues).filter(k => queues[k] === p).join(', '))}</span>${extra || ''}</div>`;
  if (!d) return `<section class="pl-sec">${head()}<div class="muted">${st?.error ? `Не загрузилось: ${esc(st.error)}` : 'Загружаю задачи из Трекера…'}</div></section>`;
  const byKey = new Map(d.issues.map(i => [i.key, i]));
  const inPlan = d.plan.map(k => byKey.get(k) || { key: k, summary: '', status: null });
  const match = i => !q || `${i.key} ${i.summary} ${i.assignee || ''}`.toLowerCase().includes(q);
  const base = d.issues.filter(i => !d.plan.includes(i.key) && !i.resolved && match(i));
  const f = pfOf(p);
  const pool = sortPool(base.filter(i =>
    (!f.statuses.length || f.statuses.includes(i.status?.display)) && (!f.types.length || f.types.includes(i.type))
    && (!f.withSession || sessionsOf(i.key).length) && (!f.withNote || d.notes[i.key])), f);
  const closedN = inPlan.filter(i => i.resolved || i.status?.type === 'done').length;
  const workN = inPlan.filter(i => ['inProgress', 'review'].includes(i.status?.type) || sessionsOf(i.key).length).length;
  const stats = d.plan.length ? `<span class="pill busy">${workN} в работе</span> <span class="pill review">${closedN} закрыто</span> <span class="muted">из ${d.plan.length}</span>` : '';
  const clean = closedN ? `<button class="ghost" data-plan-clean="${esc(p)}">убрать закрытые</button>` : '';
  // Трекер отдаёт до 100 задач за запрос — предупреждаем, только если выборка в это упёрлась.
  const more = d.total > 100 ? ` · Трекер отдал 100 из ${d.total}` : '';
  return `<section class="pl-sec">
    ${head(`${stats}${clean}${st.loading ? '<span class="spin"></span>' : ''}`)}
    ${d.error ? `<div class="pl-err">Трекер не ответил (${esc(d.error)}) — показываю, что было загружено раньше, повторю через 10 с или по ↻.</div>` : ''}
    <div class="pl-grid">
      <div class="pl-col mine"><h3>План · ${d.plan.length}</h3>
        <div class="pl-list" data-plan-project="${esc(p)}">${inPlan.map((i, n) => planRowHtml(i, d, { project: p, inPlan: true, pos: n, n: inPlan.length })).join('')
          || '<div class="pl-hint">Добавь задачи справа кнопкой «+ в план» или перетащи сюда. Порядок меняется перетаскиванием или ↑ ↓.</div>'}</div>
      </div>
      <div class="pl-col"><h3>Задачи проекта${planScope === 'mine' ? ' · мои' : ''} · ${pool.length}${pool.length !== base.length ? ` из ${base.length}` : ''}${esc(more)}</h3>
        ${poolTools(p, base, d, f)}
        <div class="pl-pool" data-plan-project="${esc(p)}">${pool.map(i => planRowHtml(i, d, { project: p })).join('') || `<div class="pl-hint">${q ? 'Ничего не найдено' : base.length ? `Под фильтр не попала ни одна из ${base.length} задач — <button class="ghost" data-pf="reset" data-pf-proj="${esc(p)}">сбросить фильтры</button>` : d.error && !d.issues.length ? 'Список не загрузился — Трекер недоступен' : 'Открытых задач нет'}</div>`}</div>
      </div>
    </div>
  </section>`;
}

function renderPlan() {
  if (planDrag || document.activeElement?.matches?.('.planpage select')) return;
  const all = queueProjects();
  const sel = planProjects.filter(p => all.includes(p));
  const q = $('#q').value.trim().toLowerCase();
  const html = `<div class="planpage">
    <div class="pl-projects"><span class="muted">Проекты:</span>${all.map(p => `<button data-plan-proj="${esc(p)}" class="${sel.includes(p) ? 'on' : ''}">${esc(p)}</button>`).join('') || '<span class="muted">нет очередей в projects.json</span>'}</div>
    ${sel.map(p => planSection(p, q)).join('') || '<div class="empty">Выбери проекты — у каждого будут его задачи из Трекера и план с очерёдностью.</div>'}
  </div>`;
  if (html === lastPlanHtml) return;
  const app = $('#app'); const scroll = app.scrollTop;
  app.innerHTML = html; app.scrollTop = scroll; lastPlanHtml = html;
}

document.addEventListener('click', e => {
  const pj = e.target.closest('[data-plan-proj]');
  if (pj) {
    const p = pj.dataset.planProj;
    planProjects = planProjects.includes(p) ? planProjects.filter(x => x !== p) : [...planProjects, p];
    store.set('planProjects', planProjects); render(false); return;
  }
  const pf = e.target.closest('[data-pf]');
  if (pf) {
    const p = pf.dataset.pfProj, f = pfOf(p), v = pf.dataset.pfVal, k = pf.dataset.pf;
    const toggle = (arr, x) => (arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x]);
    if (k === 'status') setPf(p, { statuses: toggle(f.statuses, v) });
    else if (k === 'type') setPf(p, { types: toggle(f.types, v) });
    else if (k === 'withSession' || k === 'withNote') setPf(p, { [k]: !f[k] });
    else if (k === 'desc') setPf(p, { desc: !f.desc });
    else if (k === 'reset') setPf(p, { statuses: [], types: [], withSession: false, withNote: false });
    return;
  }
  const sc = e.target.closest('[data-plan-scope]');
  if (sc) { planScope = sc.dataset.planScope; store.set('planScope', planScope); render(false); return; }
  const ds = e.target.closest('[data-day-shift]');
  if (ds) {
    const n = Number(ds.dataset.dayShift), cur = dayData[route().id || '']?.data?.date || route().id || currentDay;
    location.hash = n && cur ? `#/day/${shiftDate(cur, n)}` : '#/day';
    return;
  }
  if (e.target.closest('[data-day-refresh]')) { loadDay(route().id, true); return; }
  const wl = e.target.closest('.dcard .wl');
  if (wl) { wl.classList.toggle('open'); return; }
  if (e.target.closest('[data-plan-refresh]')) { planProjects.forEach(p => { if (planData[p]) planData[p].loading = false; loadPlan(p, true); }); return; }
  const cl = e.target.closest('[data-plan-clean]');
  if (cl) {
    const p = cl.dataset.planClean, d = planData[p]?.data; if (!d) return;
    const byKey = new Map(d.issues.map(i => [i.key, i]));
    setPlan(p, d.plan.filter(k => !(byKey.get(k)?.resolved || byKey.get(k)?.status?.type === 'done'))); return;
  }
  const row = e.target.closest('.pl-row'); if (!row) return;
  const key = row.dataset.planKey, p = row.dataset.planProject;
  const keys = [...(planData[p]?.data?.plan || [])];
  if (e.target.closest('[data-plan-add]')) return setPlan(p, [...keys, key]);
  if (e.target.closest('[data-plan-remove]')) return setPlan(p, keys.filter(k => k !== key));
  const mv = e.target.closest('[data-plan-move]');
  if (mv) {
    const i = keys.indexOf(key), j = i + Number(mv.dataset.planMove);
    if (i < 0 || j < 0 || j >= keys.length) return;
    [keys[i], keys[j]] = [keys[j], keys[i]];
    return setPlan(p, keys);
  }
  if (e.target.closest('[data-plan-start]')) location.href = `vscode://anthropic.claude-code/open?prompt=${encodeURIComponent(`/start-task ${key}`)}`;
});

document.addEventListener('change', e => {
  const p = e.target.dataset?.pfSort; if (!p) return;
  e.target.blur(); setPf(p, { sort: e.target.value });
});

// Перетаскивание: внутри плана — порядок, из списка задач в план — вставка на место, из плана
// в список задач — убрать из плана. Между проектами не переносится.
const clearDrop = () => document.querySelectorAll('.drop-before, .drop-after, .drop-end, .drop-in').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-end', 'drop-in'));
document.addEventListener('dragstart', e => {
  const row = e.target.closest?.('.pl-row'); if (!row) return;
  planDrag = { key: row.dataset.planKey, project: row.dataset.planProject, fromPlan: !!row.dataset.inPlan };
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', planDrag.key);
  row.classList.add('dragging');
});
document.addEventListener('dragend', () => {
  if (!document.querySelector('.pl-row.dragging')) return;
  planDrag = null; clearDrop(); lastPlanHtml = ''; render(false);
});
function dropTarget(e) {
  if (!planDrag) return null;
  const box = e.target.closest?.('.pl-list, .pl-pool');
  if (!box || box.dataset.planProject !== planDrag.project) return null;
  if (box.classList.contains('pl-pool') && !planDrag.fromPlan) return null;
  return box;
}
document.addEventListener('dragover', e => {
  const box = dropTarget(e); if (!box) return;
  e.preventDefault(); clearDrop();
  if (box.classList.contains('pl-pool')) { box.classList.add('drop-in'); return; }
  const row = e.target.closest('.pl-row');
  if (row && row.dataset.planKey !== planDrag.key) {
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  } else if (!row) box.classList.add('drop-end');
});
document.addEventListener('drop', e => {
  const box = dropTarget(e); if (!box) return;
  e.preventDefault();
  const { key, project } = planDrag;
  const keys = (planData[project]?.data?.plan || []).filter(k => k !== key);
  if (box.classList.contains('pl-list')) {
    const tgt = box.querySelector('.drop-before, .drop-after');
    const at = tgt ? keys.indexOf(tgt.dataset.planKey) + (tgt.classList.contains('drop-after') ? 1 : 0) : keys.length;
    keys.splice(at < 0 ? keys.length : at, 0, key);
  }
  planDrag = null; clearDrop();
  setPlan(project, keys);
});

// ---------- страница сессии ----------
let sessView = null; // { id, data, chat: Map(seq→item), seq, tab, renderedSig }
async function renderSession(id, force) {
  if (!sessView || sessView.id !== id) {
    sessView = { id, data: null, chat: new Map(), seq: 0, tab: store.get('tab', 'props'), sig: '' };
    $('#app').innerHTML = '<div class="empty">Загрузка сессии…</div>';
  }
  const v = sessView;
  let data;
  try {
    const r = await fetch(`/api/session?id=${encodeURIComponent(id)}${v.seq ? '&since=' + v.seq : ''}`);
    if (r.status === 404) { $('#app').innerHTML = '<div class="empty">Сессия завершилась или не найдена. <a href="#/board">К доске</a></div>'; return; }
    data = await r.json();
  } catch { return; }
  if (sessView !== v) return;
  if (data.chatSeq < v.seq) { v.chat.clear(); } // транскрипт перечитан с нуля
  for (const c of data.chat) v.chat.set(c.seq, c);
  v.seq = data.chatSeq; v.data = data; v.truncated = data.chatTruncated;
  markSeen(data);
  if (!$('#sessRoot') || force) layoutSession();
  updateSessionHead();
  updateChat();
  if (force || Date.now() - (v.sideAt || 0) > 5000) updateSide();
}

function layoutSession() {
  $('#app').innerHTML = `<div class="sess" id="sessRoot">
    <div class="sess-main"><div class="sess-head" id="sessHead"></div><div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>
      <div class="composer"><div class="inner">
        <textarea id="msgInput" rows="2" placeholder="Написать в сессию… (Enter — отправить, ⌘+Enter — новая строка)"></textarea>
        <div class="sendcol"><button class="primary" id="msgSend">Отправить</button>
          <button id="askConfirm" title="Попросить сессию задать вопрос, которого она ждёт, карточкой с вариантами">Спросить кнопками</button></div>
        <div class="hint muted">Сообщение уйдёт через межсессионный сокет с пометкой «[из dev-cockpit]»: Claude увидит его как реплику соседней сессии, а не как твою команду, и «да» отсюда за подтверждение не примет. Если сессия ждёт твоего «да» — жми «Спросить кнопками»: она задаст вопрос карточкой, и ответ в карточке засчитается как твой.</div>
      </div></div></div>
    <aside class="side"><div class="tabs" id="tabs">
      <button data-tab="props">Свойства</button><button data-tab="task">Задача</button><button data-tab="changes">Изменения</button><button data-tab="events">Действия</button>
    </div><div class="tabbody" id="tabbody"></div></aside>
  </div>`;
  sessView.sig = ''; sessView.stick = true;
  const input = $('#msgInput');
  input.value = drafts[`msg|${sessView.id}`] || '';
  input.addEventListener('input', () => { drafts[`msg|${sessView.id}`] = input.value; });
  // Enter — отправить; ⌘/Ctrl+Enter (и Shift+Enter) — перенос строки. Во время набора через IME Enter не трогаем.
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (e.metaKey || e.ctrlKey || e.shiftKey) {
      input.setRangeText('\n', input.selectionStart, input.selectionEnd, 'end');
      drafts[`msg|${sessView.id}`] = input.value;
    } else sendMessage();
  });
  $('#msgSend').addEventListener('click', () => sendMessage());
  $('#askConfirm').addEventListener('click', () => sendMessage(ASK_CONFIRM));
  $('#chat').addEventListener('scroll', e => { const c = e.target; sessView.stick = c.scrollHeight - c.scrollTop - c.clientHeight < 80; });
}

function updateSessionHead() {
  const s = sessView.data; const lane = laneOf(s);
  if (sessView.editing || typingInRequest()) return;
  $('#sessHead').innerHTML = `
    <div class="crumbs"><a href="#/board">Доска</a> / <span>${esc(s.project)}</span></div>
    <div class="titlerow">
      <h2 id="titleEdit" title="Нажми, чтобы переименовать">${esc(s.title)}</h2>
      <span class="pill ${lane}"><span class="dot ${lane}"></span>${LANE_LABEL[lane]}</span>${modeChip(s.permissionMode)}
      ${s.taskKey ? `<span class="chip key">${esc(s.taskKey)}</span>` : ''}
      <span class="time">активность ${ago(s.lastActivity)} назад</span>
      <span class="spacer"></span>
      ${s.status === 'idle' && !(s.requests || []).length ? `<button class="ghost" data-close="${s.sessionId}" title="${s.kind === 'background' ? 'Остановить фоновую сессию' : 'Завершить процесс вкладки VS Code'} — переписка сохранится">✕ Закрыть сессию</button>` : ''}
      ${s.kind === 'background' ? '<button id="toVSCode" title="Остановить фоновый процесс и открыть сессию во вкладке Claude в VS Code — переписка сохранится">Перенести в VS Code</button>' : ''}
    </div>
    ${s.next ? nextCloseHtml({ ...s, closable: false }) : ''}
    ${(s.requests || []).length ? `<div style="margin-top:8px">${s.requests.map(r => requestHtml(r)).join('')}</div>`
      : s.status === 'waiting' ? `<div class="waitbar">⏳ Сессия ждёт: ${esc(s.waitingFor || 'ответа')}. Ответить можно в окне сессии (VS Code / терминал).</div>` : ''}`;
}

// Реплика соседней сессии подтверждением не считается, а ответ на AskUserQuestion — да:
// он приходит через хук как ответ пользователя. Просим сессию переспросить карточкой.
const ASK_CONFIRM = 'Если ты ждёшь моего подтверждения или ответа — задай его через AskUserQuestion с вариантами '
  + '(например «Да, выполняй» / «Нет») и в вопросе коротко назови, что именно сделаешь. Я отвечу в карточке. '
  + 'Если ничего не ждёшь — просто продолжай.';

async function sendMessage(preset) {
  const input = $('#msgInput'); const btn = $('#msgSend');
  const text = preset || input.value.trim(); if (!text || !sessView) return;
  btn.disabled = true;
  try {
    await post('/api/message', { sessionId: sessView.id, text });
    if (!preset) { input.value = ''; delete drafts[`msg|${sessView.id}`]; }
    toast('Отправлено в сессию'); sessView.stick = true;
  } catch (e) { toast('Не отправилось: ' + e.message); }
  btn.disabled = false; input.focus();
}

function startRename() {
  const s = sessView.data; sessView.editing = true;
  const h = $('#titleEdit');
  h.outerHTML = `<input class="rename" id="renameInput" type="text" value="${esc(s.title)}" placeholder="Пустое — сбросить имя">`;
  const inp = $('#renameInput'); inp.focus(); inp.select();
  const finish = async save => {
    if (!sessView.editing) return; sessView.editing = false;
    if (save && inp.value.trim() !== s.title) {
      try { await post('/api/meta', { sessionId: s.sessionId, name: inp.value }); toast('Имя сохранено в dev-cockpit'); } catch (e) { toast('Ошибка: ' + e.message); }
      await poll();
    }
    renderSession(sessView.id, false);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

function toolGroupHtml(tools) {
  const counts = {};
  for (const t of tools) counts[t.name] = (counts[t.name] || 0) + 1;
  const names = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([n, c]) => c > 1 ? `${n} ×${c}` : n).join(', ');
  const pending = tools.some(t => t.result === undefined);
  const errs = tools.filter(t => t.isError).length;
  const span = tools.length > 1 ? `${hhmm(tools[0].ts)}–${hhmm(tools.at(-1).ts)}` : hhmm(tools[0].ts);
  const key = `g${tools[0].seq}`;
  const open = sessView.open?.has(key);
  return `<details class="tools" data-key="${key}" ${open ? 'open' : ''}><summary>
      <span>⚙ ${tools.length} ${tools.length === 1 ? 'действие' : 'действий'}</span><span class="names">${esc(names)}</span>
      ${errs ? `<span class="err">✗ ${errs}</span>` : ''}${pending ? '<span class="pend"><span class="spin"></span></span>' : ''}<span class="time">${span}</span>
    </summary>
    ${tools.map(t => {
      const k = `t${t.seq}`;
      const mark = t.result === undefined ? '<span class="pend">…</span>' : t.isError ? '<span class="err">✗</span>' : '<span class="ok">✓</span>';
      return `<details class="tool" data-key="${k}" ${sessView.open?.has(k) ? 'open' : ''}><summary>${mark}<span class="tn">${esc(t.name)}</span><span class="ta" title="${esc(t.summary)}">${esc(short(t.summary))}</span><span class="time">${hhmm(t.ts)}</span></summary>
        ${sessView.open?.has(k) ? toolIo(t) : ''}</details>`;
    }).join('')}
  </details>`;
}
const toolIo = t => `<div class="io"><div class="lbl">Вход</div><pre>${esc(t.input)}</pre>${t.result !== undefined ? `<div class="lbl">Результат</div><pre>${esc(t.result)}</pre>` : ''}</div>`;

function askHtml(t) {
  return `<div class="ask"><div class="muted" style="font-size:12px">❓ Claude спрашивает · ${hhmm(t.ts)}</div>
    ${(t.questions || []).map(q => `<div class="q">${esc(q.question)}</div>${q.options?.length ? `<ul>${q.options.map(o => `<li><b>${esc(o.label)}</b>${o.description ? ' — ' + esc(o.description) : ''}</li>`).join('')}</ul>` : ''}`).join('')}
    ${t.result !== undefined ? `<div class="io" style="margin:4px 0 0"><pre>${esc(t.result)}</pre></div>` : '<div class="pend">ждёт ответа…</div>'}
  </div>`;
}

function updateChat() {
  const v = sessView; const items = [...v.chat.values()].sort((a, b) => a.seq - b.seq);
  const sig = `${v.seq}:${items.length}:${items.filter(i => i.kind === 'tool' && i.result !== undefined).length}`;
  if (sig === v.sig) return;
  v.sig = sig;
  v.open = new Set([...document.querySelectorAll('#chatInner details[open]')].map(d => d.dataset.key));
  let html = v.truncated ? '<div class="loadmore">показаны последние сообщения сессии</div>' : '';
  let group = [];
  const flush = () => { if (group.length) { html += toolGroupHtml(group); group = []; } };
  for (const it of items) {
    if (it.kind === 'tool' && it.name === 'AskUserQuestion') { flush(); html += askHtml(it); continue; }
    if (it.kind === 'tool') { group.push(it); continue; }
    flush();
    html += it.kind === 'user'
      ? `<div class="msg user"><div class="who"><b>${it.via === 'cockpit' ? 'Вы · из cockpit' : it.via === 'peer' ? 'Соседняя сессия' : 'Вы'}</b><span class="time">${dayTime(it.ts)}</span></div><div class="body md">${md(it.text)}</div></div>`
      : `<div class="msg assistant"><div class="who"><b>Claude</b><span class="time">${hhmm(it.ts)}</span><button class="ghost copy-msg" data-copy="msg" title="Скопировать сообщение текстом">копировать</button></div><div class="body md">${md(it.text)}</div></div>`;
  }
  flush();
  if (!items.length) html += '<div class="empty">В транскрипте пока нет сообщений</div>';
  const chat = $('#chat'); const prev = chat.scrollTop;
  $('#chatInner').innerHTML = html;
  chat.scrollTop = v.stick ? chat.scrollHeight : prev;
}

function updateSide() {
  const v = sessView; v.sideAt = Date.now();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === v.tab));
  const s = v.data; const body = $('#tabbody');
  if (v.tab === 'props') {
    const tools = Object.entries(s.toolCounts || {}).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => `${esc(k)} ${n}`).join(' · ');
    const src = { cockpit: 'задано в dev-cockpit', rename: 'из /rename', claude: 'имя Claude Code', auto: 'придумано автоматически', derived: 'автоимя Claude Code' }[s.nameSource] || '';
    const psrc = { user: 'задан вручную', task: 'по очереди задачи', repo: 'по основному репозиторию', none: '' }[s.projectSource] || '';
    body.innerHTML = `
      <div class="props">
        <span class="k">Имя</span><span class="v">${esc(s.title)} <span class="muted">· ${src}</span></span>
        <span class="k">Проект</span><span class="v"><input type="text" id="projInput" list="projList" value="${esc(s.project)}" style="width:100%"><datalist id="projList">${projects.map(p => `<option value="${esc(p)}">`).join('')}</datalist><span class="muted" style="font-size:12px">${psrc}</span></span>
        <span class="k">Статус</span><span class="v">${esc(LANE_LABEL[laneOf(s)])}${s.waitingFor ? ' — ' + esc(s.waitingFor) : ''}</span>
        ${s.taskKey ? `<span class="k">Задача</span><span class="v"><a href="https://tracker.yandex.ru/${esc(s.taskKey)}" target="_blank" rel="noopener">${esc(s.taskKey)}</a></span>` : ''}
        <span class="k">Режим</span><span class="v">${esc(s.permissionMode ? modeName(s.permissionMode) : '—')} <span class="muted" style="font-size:12px">· меняется вместе с ответом на запрос</span></span>
        <span class="k">Ветка в cwd</span><span class="v">${esc(s.gitBranch || '—')}</span>
        <span class="k">Модель</span><span class="v">${esc(s.model || '—')}</span>
        <span class="k">Промптов</span><span class="v">${s.prompts ?? 0}</span>
        <span class="k">Начата</span><span class="v">${dayTime(s.startedAt)}</span>
        <span class="k">Активность</span><span class="v">${dayTime(s.lastActivity)}</span>
        <span class="k">Каталог</span><span class="v"><code>${esc(short(s.cwd))}</code></span>
        <span class="k">Имя в Claude</span><span class="v"><code>${esc(s.claudeName)}</code></span>
        <span class="k">Session ID</span><span class="v"><code>${esc(s.sessionId)}</code></span>
        ${tools ? `<span class="k">Инструменты</span><span class="v muted" style="font-size:12px">${tools}</span>` : ''}
      </div>
      <div class="btnrow">
        <button data-act="rename">✎ Переименовать</button>
        <button data-act="autoname">✨ Придумать имя</button>
        <button data-act="copyRename">Копировать /rename</button>
        <button data-act="copyResume">Копировать resume</button>
      </div>
      <div class="hint">Имя хранится в dev-cockpit. Чтобы оно появилось и в самом Claude Code, вставь скопированную команду <code>/rename …</code> в окно сессии: переименовать запущенную сессию снаружи Claude Code не даёт.</div>`;
    const pi = $('#projInput');
    pi.addEventListener('change', async () => {
      try { await post('/api/meta', { sessionId: s.sessionId, project: pi.value }); toast(pi.value ? `Проект: ${pi.value}` : 'Проект определяется автоматически'); await poll(); } catch (e) { toast('Ошибка: ' + e.message); }
    });
  } else if (v.tab === 'task') {
    // Только при изменениях: иначе раз в 5 с сбрасывается прокрутка длинного описания задачи.
    const html = taskTabHtml(s);
    if (v.taskHtml !== html || !body.querySelector('.task, details.issue, .hint')) { body.innerHTML = html; v.taskHtml = html; }
  } else if (v.tab === 'changes') {
    renderChanges(s, body);
  } else {
    const evs = (s.events || []).slice().reverse();
    body.innerHTML = evs.map(ev => `<div class="ev ${ev.kind === 'prompt' ? 'p' : ''}"><span class="time">${hhmm(ev.ts)}</span><span class="x" title="${esc(ev.text)}">${ev.kind === 'prompt' ? '💬 ' : `<b>${esc(ev.tool)}</b> `}${esc(short(ev.text))}</span></div>`).join('') || '<div class="muted">Пусто</div>';
    if ((s.files || []).length) body.innerHTML += `<h3 style="margin-top:16px">Правленые файлы</h3><ul class="files">${s.files.map(f => `<li title="${esc(f.file)}"><span class="code">✎${f.edits}</span><span class="f">${esc(short(f.file))}</span></li>`).join('')}</ul>`;
  }
}

// Вкладка «Задача»: заметка start-task в vault — план и ворклог; запись этой сессии раскрыта.
// Описание задачи из Трекера: грузится по требованию, держится в кэше, чтобы перерисовка вкладки
// раз в 5 с не дёргала Трекер и не схлопывала раскрытый блок.
const issueCache = new Map(); // key -> { at, data | null, error | null, loading }
const issueOpen = new Set(store.get('issueOpen', []));
const ISSUE_TTL = 120_000;
function ensureIssue(key) {
  const c = issueCache.get(key);
  if (c && (c.loading || Date.now() - c.at < ISSUE_TTL)) return;
  issueCache.set(key, { ...(c || {}), loading: true, at: c?.at || 0 });
  fetch(`/api/issue?key=${encodeURIComponent(key)}`).then(async r => {
    const j = await r.json();
    issueCache.set(key, r.ok ? { at: Date.now(), data: j } : { at: Date.now(), data: c?.data || null, error: j.error || r.status });
  }).catch(e => issueCache.set(key, { at: Date.now(), data: c?.data || null, error: e.message }))
    .finally(() => { const box = document.querySelector(`[data-issue="${key}"]`); if (box) box.outerHTML = issueHtml(key); refreshPeek(key); });
}
// YFM Трекера: ((url текст)) — ссылка, картинки из вложений без авторизации не откроются.
const yfm = t => String(t || '')
  .replace(/\(\((https?:\/\/\S+)\s+([^)]+)\)\)/g, '[$2]($1)')
  .replace(/!\[[^\]]*\]\((\/ajax\/[^)]+)\)/g, '_[картинка во вложениях задачи]_')
  .replace(/\{%\s*(?:cut|endcut|note|endnote|list tabs)[^%]*%\}/g, '');
function issueHtml(key) {
  ensureIssue(key);
  const c = issueCache.get(key) || {};
  const i = c.data;
  const meta = i ? [i.type, i.priority && `приоритет: ${i.priority}`, i.assignee && `исполнитель: ${i.assignee}`, i.author && `автор: ${i.author}`,
    i.deadline && `срок: ${i.deadline}`, i.updatedAt && `обновлена ${ago(new Date(i.updatedAt).getTime())} назад`].filter(Boolean).join(' · ') : '';
  const body = i ? (i.description.trim() ? `<div class="md idesc">${md(yfm(i.description))}</div>` : '<div class="muted">Описания нет</div>')
    : c.error ? `<div class="muted">Не загрузилось: ${esc(c.error)}</div>` : '<div class="muted">Загружаю из Трекера…</div>';
  return `<details class="issue" data-issue="${esc(key)}" ${issueOpen.has(key) ? 'open' : ''}>
    <summary><b>${esc(key)}</b>${i?.status ? ` <span class="tst t-${esc(i.status.type || 'new')}">${esc(i.status.display)}</span>` : ''} ${esc(i?.summary || 'Описание в Трекере')}</summary>
    ${meta ? `<div class="muted imeta">${esc(meta)}</div>` : ''}${body}
    <div class="imeta"><a href="https://tracker.yandex.ru/${esc(key)}" target="_blank" rel="noopener">Открыть в Трекере ↗</a></div>
  </details>`;
}
document.addEventListener('toggle', e => {
  const k = e.target.dataset?.issue; if (!k) return;
  if (e.target.open) issueOpen.add(k); else issueOpen.delete(k);
  store.set('issueOpen', [...issueOpen].slice(-50));
}, true);

// Быстрый просмотр описания с доски и из «Входящих» — без перехода на страницу сессии.
let peekKey = null;
function peekBody(key) {
  const c = issueCache.get(key) || {}; const i = c.data;
  const meta = i ? [i.type, i.priority && `приоритет: ${i.priority}`, i.assignee && `исполнитель: ${i.assignee}`, i.author && `автор: ${i.author}`,
    i.deadline && `срок: ${i.deadline}`, i.updatedAt && `обновлена ${ago(new Date(i.updatedAt).getTime())} назад`].filter(Boolean).join(' · ') : '';
  const body = i ? (i.description.trim() ? `<div class="md">${md(yfm(i.description))}</div>` : '<div class="muted">Описания нет</div>')
    : c.error ? `<div class="muted">Не загрузилось: ${esc(c.error)}</div>` : '<div class="muted">Загружаю из Трекера…</div>';
  return `<div class="wh"><b>${esc(key)}${i?.status ? ` · ${esc(i.status.display)}` : ''}${i?.summary ? ` — ${esc(i.summary)}` : ''}</b>
      <a href="https://tracker.yandex.ru/${esc(key)}" target="_blank" rel="noopener">Открыть в Трекере ↗</a><button data-peek-close>Закрыть (Esc)</button></div>
    <div class="peekbody">${meta ? `<div class="muted imeta">${esc(meta)}</div>` : ''}${body}</div>`;
}
function openPeek(key) {
  closePeek();
  peekKey = key;
  ensureIssue(key);
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'peek';
  o.innerHTML = `<div class="win peek">${peekBody(key)}</div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-peek-close]')) closePeek(); });
  document.body.append(o);
}
function closePeek() { document.getElementById('peek')?.remove(); peekKey = null; }
function refreshPeek(key) { const w = document.querySelector('#peek .win'); if (w && peekKey === key) w.innerHTML = peekBody(key); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && peekKey) closePeek(); });
// В фазе перехвата: кнопка лежит внутри карточки, а клик по карточке открывает сессию.
document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-peek]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  openPeek(b.dataset.peek);
}, true);

function taskTabHtml(s) {
  const notes = s.taskNotes || [];
  const keys = [...new Set([s.taskKey, ...notes.map(n => n.issue)].filter(Boolean))];
  const issues = keys.length ? `<div class="sub">Задача в Трекере</div>${keys.map(issueHtml).join('')}` : '';
  if (!notes.length) return `${issues}<div class="muted" style="margin-top:10px">Заметки задачи нет.</div><div class="hint">План и ворклог по сессиям ведёт скилл <code>/start-task</code>: заметка в vault с шапкой <code>issue: КЛЮЧ</code>, разделами «Что нужно сделать» и «Ворклог» (<code>### дата · сессия ${esc(s.sessionId.slice(0, 8))}</code>). Сессии без него здесь пусто.</div>`;
  const sid = s.sessionId.slice(0, 8);
  const field = (lbl, t) => (t ? `<div class="lbl">${lbl}</div><div class="md">${md(t)}</div>` : '');
  return issues + `<div class="sub">Заметка задачи</div>` + notes.map(n => {
    const done = n.todo.filter(t => t.done).length;
    const pct = n.todo.length ? Math.round((done / n.todo.length) * 100) : 0;
    const mrs = (n.mr || '').split(/[\s,]+/).filter(u => /^https?:/.test(u));
    const log = n.log.slice().reverse().map(e => {
      const mine = e.session === sid;
      const body = field('Сделано', e.done) + field('Осталось', e.left) + (e.blockers && !/^нет\.?$/i.test(e.blockers) ? field('Блокеры', e.blockers) : '');
      return mine
        ? `<div class="wl mine"><b>${esc(e.date)} · эта сессия</b>${body}</div>`
        : `<details class="wl"><summary>${esc(e.date)} · сессия ${esc(e.session)}</summary>${body}</details>`;
    }).join('');
    return `<div class="task">
      <div class="th">${n.issue ? `<a href="https://tracker.yandex.ru/${esc(n.issue)}" target="_blank" rel="noopener">${esc(n.issue)}</a>` : ''}${s.trackerStatus?.[n.issue] ? `<span class="tst t-${esc(s.trackerStatus[n.issue].type || 'new')}">${esc(s.trackerStatus[n.issue].display)}</span>` : ''}<span>${esc(n.title.replace(`${n.issue} — `, ''))}</span></div>
      <div class="muted" style="font-size:11.5px"><code>${esc(n.file)}</code>${n.branch ? ` · ${esc(n.branch)}` : ''}${mrs.map((u, i) => ` · <a href="${esc(u)}" target="_blank" rel="noopener">MR${mrs.length > 1 ? ' ' + (i + 1) : ''}</a>`).join('')}</div>
      ${n.todo.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Что нужно сделать · ${done}/${n.todo.length}</div>
      <ul class="todo">${n.todo.map(t => `<li class="${t.done ? 'done' : ''}"><span class="m">${t.done ? "✓" : "○"}</span><div class="md">${md(t.text)}</div></li>`).join('')}</ul>` : ''}
      ${log ? `<div class="sub">Ворклог</div>${log}` : ''}
    </div>`;
  }).join('');
}

async function renderChanges(s, body) {
  const repos = s.repos || [];
  if (!repos.length) { body.innerHTML = '<div class="muted">Сессия не трогала git-репозитории</div>'; return; }
  const infos = await Promise.all(repos.map(r => fetch('/api/repo?repo=' + encodeURIComponent(r)).then(x => x.json()).catch(() => null)));
  if (sessView?.tab !== 'changes') return;
  body.innerHTML = infos.filter(Boolean).map(r => {
    if (r.error && !r.branch) return `<div class="repo"><b>${esc(r.name)}</b> <span class="del">${esc(r.error)}</span></div>`;
    const num = Object.fromEntries((r.workStat || []).map(x => [x.file, x]));
    const work = (r.status || []).map(st => { const n = num[st.file]; return `<li data-repo="${esc(r.repo)}" data-mode="work" data-file="${esc(st.file)}" title="${esc(st.file)}"><span class="code">${esc(st.code.trim() || '·')}</span><span class="f">${esc(st.file)}</span>${n ? `<span class="add">+${n.add ?? '?'}</span><span class="del">−${n.del ?? '?'}</span>` : ''}</li>`; }).join('');
    const branch = (r.branchStat || []).map(x => `<li data-repo="${esc(r.repo)}" data-mode="branch" data-file="${esc(x.file)}" title="${esc(x.file)}"><span class="code">Δ</span><span class="f">${esc(x.file)}</span><span class="add">+${x.add ?? '?'}</span><span class="del">−${x.del ?? '?'}</span></li>`).join('');
    const commits = (r.commits || []).map(c => `<li title="${esc(c.subject)}"><code>${esc(c.hash)}</code> ${esc(c.subject)} <span class="time">${ago(c.ts)}</span></li>`).join('');
    const isVault = r.repo.endsWith('/Документация');
    return `<div class="repo"${isVault ? ' style="opacity:.75"' : ''}>
      <div class="head"><b>${esc(r.name)}</b><span class="chip">${esc(r.branch)}</span>${r.base ? `<span class="time">+${r.ahead} от ${esc(r.base)}</span>` : ''}</div>
      ${work ? `<div class="sub">Незакоммичено · ${r.status.length} <button class="ghost" data-repo="${esc(r.repo)}" data-mode="work">весь diff</button></div><ul class="files">${work}</ul>` : '<div class="sub">Рабочее дерево чистое</div>'}
      ${commits ? `<div class="sub">Коммиты ветки</div><ul class="commits">${commits}</ul>` : ''}
      ${branch ? `<div class="sub">Изменения ветки · ${r.branchStat.length} <button class="ghost" data-repo="${esc(r.repo)}" data-mode="branch">весь diff</button></div><ul class="files">${branch}</ul>` : ''}
    </div>`;
  }).join('');
}

async function openDiff(repo, mode, file) {
  const qs = new URLSearchParams({ repo, mode, ...(file ? { file } : {}) });
  const text = await (await fetch('/api/diff?' + qs)).text();
  const lines = text.split('\n').map(l => {
    const c = /^(\+\+\+|---|diff )/.test(l) ? 'm' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : l.startsWith('@@') ? 'h' : '';
    return `<span class="${c}">${esc(l) || ' '}</span>`;
  }).join('');
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="win"><div class="wh"><b>${esc(repo.split('/').pop())} · ${mode === 'work' ? 'незакоммичено' : 'ветка'}${file ? ' · ' + esc(file) : ''}</b><button id="closeDiff">Закрыть (Esc)</button></div>
    <pre class="diff">${text.trim() ? lines : '<span>нет изменений</span>'}</pre></div>`;
  document.body.append(o);
  const close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  o.addEventListener('click', e => { if (e.target === o || e.target.id === 'closeDiff') close(); });
  document.addEventListener('keydown', onKey);
}

// ---------- события ----------
document.addEventListener('click', async e => {
  const dec = e.target.closest('[data-decide]');
  if (dec) { e.preventDefault(); dec.disabled = true; decideRequest(dec.dataset.id, dec.dataset.decide); return; }
  const nx = e.target.closest('[data-next]');
  if (nx) { e.stopPropagation(); location.href = `vscode://anthropic.claude-code/open?prompt=${encodeURIComponent(`/start-task ${nx.dataset.next}`)}`; return; }
  const cl = e.target.closest('[data-close]');
  if (cl) { e.stopPropagation(); closeSessionUi([cl.dataset.close]); return; }
  if (e.target.id === 'closeAll') { closeSessionUi(sessions.filter(s => s.closable).map(s => s.sessionId)); return; }
  const ra = e.target.closest('[data-rule-add]');
  if (ra) { const x = rulesData?.suggestions[Number(ra.dataset.ruleAdd)]; if (x) rulesAction({ action: 'add', rule: { tool: x.tool, prefix: x.prefix, domain: x.domain } }); return; }
  const rd = e.target.closest('[data-rule-dismiss]');
  if (rd) { const x = rulesData?.suggestions[Number(rd.dataset.ruleDismiss)]; if (x) rulesAction({ action: 'dismiss', key: x.key }); return; }
  const rr = e.target.closest('[data-rule-remove]');
  if (rr) { if (confirm('Удалить правило? Такие запросы снова будут спрашивать.')) rulesAction({ action: 'remove', id: rr.dataset.ruleRemove }); return; }
  const open = e.target.closest('[data-open]');
  const seenBtn = e.target.closest('[data-seen]');
  if (seenBtn) { e.stopPropagation(); const s = sessions.find(x => x.sessionId === seenBtn.dataset.seen); markSeen(s); render(false); return; }
  if (e.target.id === 'seenAll') { sessions.filter(toReview).forEach(markSeen); render(false); return; }
  if (open) { location.hash = `#/session/${open.dataset.open}`; return; }
  const lane = e.target.closest('[data-lane]');
  if (lane) { const p = lane.dataset.lane; collapsed[p] = !collapsed[p]; store.set('collapsed', collapsed); render(false); return; }
  const grp = e.target.closest('[data-group]');
  if (grp) { groupBy = grp.dataset.group; store.set('groupBy', groupBy); render(false); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab && sessView) { sessView.tab = tab.dataset.tab; store.set('tab', sessView.tab); updateSide(); return; }
  if (e.target.id === 'titleEdit') { startRename(); return; }
  const diff = e.target.closest('[data-repo]');
  if (diff) { openDiff(diff.dataset.repo, diff.dataset.mode, diff.dataset.file); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  const s = sessView?.data;
  if (act === 'rename') startRename();
  if (act === 'copyRename' && s) copy(`/rename ${s.title}`);
  if (act === 'copyResume' && s) copy(`claude --resume ${s.sessionId}`);
  if (act === 'autoname' && s) { await post('/api/autoname', { sessionId: s.sessionId, force: true }); toast('Придумываю имя…'); poll(); }
});
// Ленивая подгрузка входа/результата инструмента при раскрытии.
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches?.('details.tool') || !d.open || d.querySelector('.io')) return;
  const it = sessView?.chat.get(Number(d.dataset.key.slice(1)));
  if (it) d.insertAdjacentHTML('beforeend', toolIo(it));
}, true);
$('#q').addEventListener('input', () => render(false));
document.addEventListener('click', async e => {
  if (e.target.id !== 'toVSCode' || !sessView) return;
  if (!confirm('Остановить фоновую сессию и открыть её в VS Code? Переписка сохранится; если Claude ждал разрешения, он повторит этот шаг уже в VS Code.')) return;
  e.target.disabled = true;
  try { await post('/api/to-vscode', { sessionId: sessView.id }); toast('Открываю в VS Code'); }
  catch (err) { toast('Не вышло: ' + err.message); e.target.disabled = false; }
});
$('#openTask').addEventListener('click', () => {
  const key = (prompt('Ключ задачи Трекера, например POLAERP-194') || '').trim().toUpperCase();
  if (!key) return;
  if (!/^[A-Z][A-Z0-9]{1,15}-\d{1,6}$/.test(key)) return toast('Неверный ключ задачи');
  // Расширение Claude подставит текст во вкладку, отправить — Enter в VS Code.
  location.href = `vscode://anthropic.claude-code/open?prompt=${encodeURIComponent(`/start-task ${key}`)}`;
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.draftText; if (!k) return;
  drafts[k] = e.target.value;
  if (e.target.tagName === 'SELECT') e.target.classList.toggle('on', !!e.target.value);
  // «Свой вариант» в вопросе с одним ответом снимает отметку с вариантов — уйдёт именно текст.
  const m = k.match(/^(.+)\|other\|(\d+)$/);
  if (m && e.target.value.trim()) {
    const radios = document.querySelectorAll(`input[type=radio][data-draft="${m[1]}|${m[2]}"]`);
    if (radios.length) { radios.forEach(r => { r.checked = false; }); drafts[`${m[1]}|${m[2]}`] = []; }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset?.draft; if (!k) return;
  const set = new Set(e.target.type === 'radio' ? [] : drafts[k] || []);
  if (e.target.checked) set.add(e.target.value); else set.delete(e.target.value);
  drafts[k] = [...set];
  // Выбрал вариант в вопросе с одним ответом — свой текст больше не нужен.
  if (e.target.type === 'radio') {
    const [id, qi] = k.split('|');
    const other = document.querySelector(`input[data-draft-text="${id}|other|${qi}"]`);
    if (other) other.value = '';
    delete drafts[`${id}|other|${qi}`];
  }
});
document.addEventListener('change', e => { if (e.target.id === 'showCold') { showCold = e.target.checked; store.set('showCold', showCold); render(false); } });
$('#autoname').onclick = async () => {
  try { const r = await post('/api/autoname', {}); toast(r.queued ? `Придумываю имена: ${r.queued}` : 'Все сессии уже с именами'); poll(); } catch (e) { toast('Ошибка: ' + e.message); }
};
$('#notifyBtn').onclick = async () => {
  if (!notifyOn && 'Notification' in window && Notification.permission !== 'granted') await Notification.requestPermission();
  notifyOn = !notifyOn && Notification.permission === 'granted'; store.set('notify', notifyOn); render(false);
};

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
